version: "0.2"
name: kernel
summary: >
  Letta-only kernel variant (fork addition, not upstream): all three
  agents run on Letta Code. Selected by rig daemon start when neither
  Claude Code nor Codex is available and Letta Code is installed. Each
  seat declares no Letta agent binding, so it creates its own agent on
  its first launch and binds that agent from then on.

culture_file: culture/CULTURE.md

pods:
  - id: advisor
    label: Advisor
    members:
      - id: lead
        agent_ref: "local:agents/advisor/lead"
        runtime: letta
        profile: default
        cwd: "."

  - id: operator
    label: Operator
    members:
      - id: human
        agent_ref: "builtin:terminal"
        runtime: terminal
        profile: none
        cwd: "."
        startup:
          actions:
            - type: send_text
              value: rig tui
              phase: after_ready
              applies_on: [fresh_start]
              idempotent: true
      - id: agent
        agent_ref: "local:agents/operator/agent"
        runtime: letta
        profile: default
        cwd: "."
    edges:
      - kind: collaborates_with
        from: agent
        to: human
      - kind: escalates_to
        from: agent
        to: human

  - id: queue
    label: Queue
    members:
      - id: worker
        agent_ref: "local:agents/queue/worker"
        runtime: letta
        profile: default
        cwd: "."

edges:
  - kind: delegates_to
    from: advisor.lead
    to: operator.agent
  - kind: delegates_to
    from: advisor.lead
    to: queue.worker
  - kind: escalates_to
    from: queue.worker
    to: advisor.lead
